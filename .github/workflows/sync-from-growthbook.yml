name: Sync with GrowthBook

on:
  repository_dispatch:
    types: [growthbook-api-changed]
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:
    inputs:
      since:
        description: GrowthBook commit to review from (default is 7 days ago)
        required: false
      dry_run:
        description: Show the PR in the job summary instead of pushing
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-from-growthbook
  cancel-in-progress: false

env:
  SYNC_BRANCH: sync/growthbook
  SYNC_DIR: ${{ github.workspace }}/.sync
  SKILLS_DIR: ${{ github.workspace }}/skills
  GROWTHBOOK_DIR: ${{ github.workspace }}/growthbook
  GH_TOKEN: ${{ github.token }}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout skills
        uses: actions/checkout@v5
        with:
          path: skills
          fetch-depth: 0

      - name: Checkout GrowthBook
        uses: actions/checkout@v5
        with:
          repository: growthbook/growthbook
          path: growthbook
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      # Run the helpers from main even after switching to an older branch.
      - name: Test sync helpers
        run: |
          mkdir -p "$SYNC_DIR"
          cp -r skills/.github/sync "$SYNC_DIR/tools"
          node --test "$SYNC_DIR/tools/sync.test.mjs"

      - name: Resolve the commit range
        id: scope
        working-directory: growthbook
        env:
          DISPATCH_BEFORE: ${{ github.event.client_payload.before }}
          DISPATCH_AFTER: ${{ github.event.client_payload.after }}
          SINCE: ${{ inputs.since }}
        run: |
          after=${DISPATCH_AFTER:-$(git rev-parse HEAD)}
          before=${DISPATCH_BEFORE:-${SINCE:-$(git rev-list -1 --before="7 days ago" HEAD)}}
          for sha in "$before" "$after"; do
            [[ "$sha" =~ ^[0-9a-f]{7,40}$ ]] || { echo "::error::Invalid commit: $sha"; exit 1; }
          done
          git checkout -q "$after"
          git log --format=%H "$before..$after" -- \
            packages/back-end/src/api packages/shared/src/validators \
            packages/back-end/generated/spec.yaml docs/statistics \
            docs/experimentation-analysis docs/features docs/api/introduction.mdx \
            docs/app/experiment-results.mdx docs/app/experiment-decisions.mdx \
            docs/app/sticky-bucketing.mdx docs/app/metrics.mdx > "$SYNC_DIR/commits.txt"
          git show "$before:packages/back-end/generated/spec.yaml" > "$SYNC_DIR/base-spec.yaml"
          {
            echo "before=$before"
            echo "after=$after"
            echo "commits=$(wc -l < "$SYNC_DIR/commits.txt" | tr -d ' ')"
          } >> "$GITHUB_OUTPUT"

      # The sync PR links each of these, which also adds a backlink on the
      # GrowthBook PR. A growthbook/skills link in a PR description marks the
      # skills PR that this run should add to.
      - name: Find the GrowthBook PRs
        run: |
          while read -r sha; do
            gh api "repos/growthbook/growthbook/commits/$sha/pulls" \
              --jq '.[] | select(.merged_at != null) | [.number, .title, ([(.body // "") | scan("growthbook/skills(?:#|/pull/)([0-9]+)") | .[0]] | unique | join(","))] | @tsv'
          done < "$SYNC_DIR/commits.txt" | sort -u -t$'\t' -k1,1n > "$SYNC_DIR/growthbook-prs.tsv"
          cat "$SYNC_DIR/growthbook-prs.tsv"

      - name: Pick the PR to add to
        id: target
        run: |
          node growthbook/scripts/check-agent-skills-drift.mjs --skills skills \
            --spec growthbook/packages/back-end/generated/spec.yaml \
            --base-spec "$SYNC_DIR/base-spec.yaml" > "$SYNC_DIR/drift.md"
          gh pr list -R "$GITHUB_REPOSITORY" --state open --limit 100 \
            --json number,headRefName,isCrossRepository,body,files > "$SYNC_DIR/open-prs.json"
          node "$SYNC_DIR/tools/sync.mjs" pick-target >> "$GITHUB_OUTPUT"
          cat "$SYNC_DIR/target.json"

      - name: Check out the target branch
        id: base
        working-directory: skills
        env:
          KIND: ${{ steps.target.outputs.kind }}
          BRANCH: ${{ steps.target.outputs.branch }}
        run: |
          if [ "$KIND" != "new" ]; then
            git checkout -q -B "$BRANCH" "origin/$BRANCH"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Drift report
        id: drift
        run: |
          node growthbook/scripts/check-agent-skills-drift.mjs --skills skills \
            --spec growthbook/packages/back-end/generated/spec.yaml \
            --base-spec "$SYNC_DIR/base-spec.yaml" > "$SYNC_DIR/drift.md"
          cat "$SYNC_DIR/drift.md" >> "$GITHUB_STEP_SUMMARY"
          if grep -q "No drift found." "$SYNC_DIR/drift.md"; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Render the prompt
        id: prompt
        if: steps.scope.outputs.commits != '0' || steps.drift.outputs.clean != 'true'
        env:
          BEFORE: ${{ steps.scope.outputs.before }}
          AFTER: ${{ steps.scope.outputs.after }}
        run: |
          {
            echo "text<<PROMPT_EOF"
            node "$SYNC_DIR/tools/sync.mjs" prompt
            echo "PROMPT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Update skills with Claude
        if: steps.prompt.outcome == 'success'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          # Dispatches may come from a GitHub App token, whose actor is a bot.
          allowed_bots: "*"
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 80
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(git -C growthbook log:*),Bash(git -C growthbook show:*),Bash(git -C growthbook diff:*),Bash(git -C skills diff:*),Bash(git -C skills checkout -- :*),Bash(node growthbook/scripts/check-agent-skills-drift.mjs:*)"

      - name: Guard the edits
        id: guard
        if: steps.prompt.outcome == 'success'
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set +e
          node "$SYNC_DIR/tools/sync.mjs" guard
          status=$?
          set -e
          cat "$SYNC_DIR/guard.md" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$SYNC_DIR/notes.md" ]; then
            { echo; cat "$SYNC_DIR/notes.md"; } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$(git -C skills status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          exit $status

      - name: Publish
        if: steps.guard.outputs.changed == 'true'
        working-directory: skills
        env:
          KIND: ${{ steps.target.outputs.kind }}
          NUMBER: ${{ steps.target.outputs.number }}
          BRANCH: ${{ steps.target.outputs.branch }}
          BEFORE: ${{ steps.scope.outputs.before }}
          AFTER: ${{ steps.scope.outputs.after }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          TITLE: Sync skills with GrowthBook API changes
        run: |
          node "$SYNC_DIR/tools/sync.mjs" section
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills
          git commit -q -F "$SYNC_DIR/commit-message.txt"

          case "$KIND" in
            new)
              {
                echo "Draft from the GrowthBook sync job. Check each change against its cited source before merging."
                echo
                cat "$SYNC_DIR/section.md"
              } > "$SYNC_DIR/body.md"
              ;;
            sync)
              {
                gh pr view "$NUMBER" --json body --jq .body
                echo
                cat "$SYNC_DIR/section.md"
              } > "$SYNC_DIR/body.md"
              ;;
            related)
              {
                echo "The GrowthBook sync job added a commit to this PR because it covers the same change."
                echo
                cat "$SYNC_DIR/section.md"
              } > "$SYNC_DIR/body.md"
              ;;
          esac

          if [ "$DRY_RUN" = "true" ]; then
            case "$KIND" in
              new) action="Open draft PR \"$TITLE\" from \`$BRANCH\`"; heading="PR description" ;;
              sync) action="Push to \`$BRANCH\` and update the description of #$NUMBER"; heading="PR description after this run" ;;
              related) action="Push to \`$BRANCH\` and comment on #$NUMBER"; heading="Comment" ;;
            esac
            {
              echo "## Dry run: nothing was pushed"
              echo
              echo "- **Would:** $action"
              echo "- **Commit:** $(head -1 "$SYNC_DIR/commit-message.txt")"
              echo
              echo "### $heading"
              echo
              cat "$SYNC_DIR/body.md"
              echo
              echo "### Diff"
              echo
              echo '````diff'
              git show --format= HEAD
              echo '````'
            } | tee "$SYNC_DIR/dry-run.md" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          case "$KIND" in
            new)
              git push -q --force origin "HEAD:refs/heads/$BRANCH"
              gh pr create --draft --head "$BRANCH" --title "$TITLE" --body-file "$SYNC_DIR/body.md"
              ;;
            sync)
              git push -q origin "HEAD:refs/heads/$BRANCH"
              gh pr edit "$NUMBER" --body-file "$SYNC_DIR/body.md"
              ;;
            related)
              git push -q origin "HEAD:refs/heads/$BRANCH"
              gh pr comment "$NUMBER" --body-file "$SYNC_DIR/body.md"
              ;;
          esac
